<title>한능검 기출노트</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 이서윤체(흥국생명, 상업적·웹 임베딩 무료) — 로고·제목용 */
@font-face{font-family:'IsYun';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff') format('woff');font-weight:normal;font-display:swap}
/* 레이아웃: 상단 고정 바(메뉴·회차) + 가운데 단일 칼럼(최대 760px). 나라별 메뉴는 넓은 화면에서 좌측 목록 + 우측 내용 */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --fg:#1d2329; --muted:#6b7380; --line:#e3e4e1;
  --accent:#2f4f8f; --accent-soft:#e8edf7; --pencil:#d8322b; --memo:#fff5c4; --memo-line:#eadb9c; --memo-ink:#3b3423;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b4352f; --bad-soft:#fae8e6;
  --display:"IsYun","Gowun Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181c; --surface:#1d2127; --fg:#e6e8eb; --muted:#9aa2ad; --line:#2d333b;
  --accent:#8fb0ec; --accent-soft:#25304a; --memo:#38331f; --memo-line:#4b4429; --memo-ink:#ece2bf; --ok:#6fcf9b; --ok-soft:#1d3329; --bad:#f08a83; --bad-soft:#3b2422; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1d2127; --fg:#e6e8eb; --muted:#9aa2ad; --line:#2d333b;
  --accent:#8fb0ec; --accent-soft:#25304a; --memo:#38331f; --memo-line:#4b4429; --memo-ink:#ece2bf; --ok:#6fcf9b; --ok-soft:#1d3329; --bad:#f08a83; --bad-soft:#3b2422; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:normal;font-size:22px;letter-spacing:0;margin-right:auto}
.brand small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{padding:6px 14px;border-radius:6px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface);font-weight:500}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.col{max-width:760px;margin:0 auto}

/* 회차 선택 */
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.rounds button{flex:none;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.rounds button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 18px}
.tb-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.tb-btn{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted)}
.tb-btn:hover{color:var(--fg);border-color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch-ui{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
.switch-ui::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .switch-ui{background:var(--accent)}
.switch input:checked + .switch-ui::after{transform:translateX(14px)}
.switch input:checked ~ *{color:var(--fg)}
.switch input:focus-visible + .switch-ui{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-size:15px}
.linkbtn{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* 번호판: 테두리 없는 칩, 상태는 배경색으로 */
.qnav{margin-bottom:20px}
.qnav-head{display:none}
.qnav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.qnav button{height:30px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);font-variant-numeric:tabular-nums;max-width:100%;transition:background .12s,color .12s}
.qnav button:not(.picked,.ok,.bad):hover{background:var(--accent-soft);color:var(--accent)}
.qnav .picked{background:var(--fg);color:var(--bg);font-weight:700}
.qnav .ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.qnav .bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.qnav .cur:not(.picked,.ok,.bad){background:var(--line);color:var(--fg);font-weight:700}
.qnav .cur:is(.picked,.ok,.bad){filter:brightness(.94)}

/* 문항 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 10px;margin-bottom:18px;scroll-margin-top:120px}
.qhead{display:flex;gap:10px;align-items:baseline}
.qnum{font-family:var(--display);font-weight:normal;font-size:22px;font-variant-numeric:tabular-nums;flex:none}
.qtext{font-weight:500;min-width:0}
.pts{font-size:12px;color:var(--muted);flex:none;margin-left:auto}
.qimg{margin:0 0 4px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;max-width:600px}
.qimg img{width:100%;height:auto}
.qimg summary{font-size:12px;color:var(--muted);padding:6px 10px;cursor:pointer;background:var(--surface)}
.clue{font-size:13.5px;background:var(--accent-soft);border-radius:6px;padding:8px 12px;margin:10px 0 4px}
.clue b{color:var(--accent);font-weight:700;margin-right:6px}
.target{font-size:12.5px;color:var(--muted);margin-top:4px}

.choices{list-style:none;margin:10px 0 0;padding:0}
.ch{border-top:1px solid var(--line)}
.ch:first-child{border-top:0}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.pick{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-size:13px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--muted);transition:.15s}
.pick:hover{border-color:var(--accent);color:var(--accent)}
.ctext{flex:1;min-width:0;text-align:left;padding-top:2px;display:flex;gap:8px;align-items:flex-start}
.ctext .tx{flex:1}
.ctext .caret{flex:none;color:var(--muted);font-size:11px;padding-top:5px;transition:transform .15s}
.ch.open .caret{transform:rotate(90deg)}
.ch.sel .pick{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.q.done .ch.correct .pick{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.q.done .ch.sel.wrong .pick{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.q.done .ch.correct .tx{color:var(--ok);font-weight:500}
.exp{display:none;margin:0 0 10px 38px;padding:8px 12px;border-left:2px solid var(--line);font-size:13.5px;color:var(--fg)}
.ch.open .exp{display:block}
.q.done .ch.correct .exp{border-left-color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.c{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);font-weight:500}
.verdict{font-size:12px;font-weight:700;margin-right:6px}
.verdict.o{color:var(--ok)} .verdict.x{color:var(--bad)}
.cthumb{display:block;width:auto;height:auto;max-height:96px;max-width:100%;border-radius:4px;border:1px solid var(--line);background:#fff}
.phname{display:none;font-size:13px;margin-top:4px}
.q.done .phname,.ch.open .phname{display:block}
.qmain{min-width:0}
.memo{margin:6px 0 8px;padding-top:8px;border-top:1px dashed var(--line)}
.memo{display:flex;flex-direction:column}
.memo-btn{align-self:flex-end;font-size:12.5px;color:var(--muted);padding:5px 10px;border-radius:6px;background:var(--bg)}
.memo-btn:hover{color:var(--fg)}
.memo.has .memo-btn{color:var(--accent);background:var(--accent-soft);font-weight:700}
.memo-ta{display:none;width:100%;margin-top:8px;min-height:112px;padding:0 14px 28px;border:0;border-radius:0;resize:vertical;
  color:var(--memo-ink);font:17px/28px var(--display);
  background-color:var(--memo);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--memo-line) 27px 28px);background-attachment:local;
  box-shadow:0 1px 1px rgba(0,0,0,.06),0 8px 16px -10px rgba(60,45,0,.45)}
.memo-ta::placeholder{color:var(--memo-ink);opacity:.45}
.memo.open .memo-ta{display:block}
.memo-ta:focus{outline:none}
/* 모바일·태블릿: 번호판은 아래에서 올라오는 시트, 왼쪽 아래 버튼으로 연다 */
.qnav-fab{display:none}
.qnav-backdrop{position:fixed;inset:0;z-index:29;background:rgba(15,20,30,.32)}
@media (max-width:999px){
  .qnav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));
    background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.3);
    transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
  .qnav.open{transform:none;visibility:visible;transition:transform .22s ease}
  .qnav-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .qnav-head span:first-child{font-family:var(--display);font-size:20px}
  .qnav-prog{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qnav-prog i{font-style:normal;margin:0 2px;opacity:.5}
  .qnav-grid{grid-template-columns:repeat(10,1fr);gap:5px}
  .qnav button{height:32px;background:var(--bg)}
  /* 채점하기 버튼과 같은 높이(40px)·같은 모서리 */
  .qnav-fab{display:flex;align-items:center;gap:4px;position:fixed;z-index:15;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
    height:40px;padding:0 14px;border-radius:14px;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 6px 18px -8px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
  .qnav-fab b{font-size:14px;line-height:1}
  .qnav-fab span{font-size:12px;line-height:1;color:var(--muted)}
}
@media (prefers-reduced-motion:reduce){.qnav{transition:none!important}}
@media (min-width:1000px){
  main{max-width:none}
  .tl-scroll{min-height:200px}
  .cview{max-width:1048px;margin:0 auto}
  /* 번호판: 왼쪽 가운데 높이에 떠 있는 5열×10줄 패널 */
  /* 문항·메모(1048px)는 화면 가운데, 번호판(178px)은 그 왼쪽 여백의 가운데에 둔다 */
  .qnav{position:fixed;z-index:12;left:max(19px,calc(25vw - 351px));top:50%;transform:translateY(-50%);margin:0;
    width:178px;padding:12px 12px 14px;background:var(--surface);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -16px rgba(30,40,70,.35)}
  .qnav-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .qnav-head span:first-child{font-family:var(--display);font-size:18px}
  .qnav-prog{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qnav-prog i{font-style:normal;margin:0 2px;opacity:.5}
  .qnav-grid{grid-template-columns:repeat(5,1fr);gap:4px}
  .qnav button{height:26px;font-size:11.5px;background:transparent}
  .qnav button:not(.picked,.ok,.bad):hover{background:var(--bg);color:var(--fg)}
  /* 10문항(2줄)마다 살짝 띄운다 */
  .qnav button:nth-child(10n+1):not(:first-child),.qnav button:nth-child(10n+2):not(:nth-child(2)),
  .qnav button:nth-child(10n+3):not(:nth-child(3)),.qnav button:nth-child(10n+4):not(:nth-child(4)),
  .qnav button:nth-child(10n+5):not(:nth-child(5)){margin-top:8px}
  .col-round{max-width:1048px;margin-left:max(200px,calc((100% - 1048px) / 2));margin-right:auto}
}
@media (min-width:1000px){
  /* 문항 카드는 원래 폭(760px) 그대로 두고, 메모지만 카드 바깥 오른쪽에 붙인다 */
  .col-round{max-width:1048px}
  .col-round .q{position:relative;max-width:760px;margin-right:288px}
  .memo{position:absolute;top:10px;bottom:0;left:calc(100% + 18px);width:270px;margin:0;padding:0;border-top:0;display:flex;flex-direction:column}
  .memo::before{content:"";position:absolute;z-index:1;top:-9px;left:50%;width:76px;height:20px;transform:translateX(-50%) rotate(-2deg);background:var(--accent-soft);opacity:.85;border-radius:0}
  .memo-btn{display:none}
  .memo-ta{display:block;flex:1;margin:0;padding-top:14px;background-position:0 14px;resize:none}
}
.grade-all{position:fixed;z-index:15;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;height:40px;font-size:13.5px;font-weight:700;letter-spacing:.02em;padding:0 17px;border-radius:14px;background:var(--bad);color:var(--surface);
  box-shadow:0 6px 18px -6px rgba(120,20,15,.55)}
.grade-all:hover{filter:brightness(1.08)}
.grade-all:active{transform:translateY(1px)}
.col-round{padding-bottom:64px}
.acct{position:relative;display:flex;align-items:center;gap:10px;font-size:13px}
.acct-btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.sync{color:var(--muted);font-size:12px}
.sync:empty{display:none}
.sync[data-s="error"]{color:var(--bad)}
.acct-save{border-color:var(--accent);color:var(--accent);font-weight:700}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(15,20,30,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-card{position:relative;width:min(380px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);color:var(--fg);border-radius:16px;padding:32px 28px 24px;box-shadow:0 30px 70px -28px rgba(0,0,0,.45)}
.modal-card h2{margin:0;font-family:var(--display);font-weight:normal;font-size:26px;text-align:center}
.modal-lead{margin:6px 0 22px;color:var(--muted);font-size:13.5px;text-align:center}
.modal-list{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:9px}
.modal-list li{display:flex;align-items:center;gap:10px;font-size:14px}
.modal-list svg{flex:none;width:18px;height:18px;padding:3px;border-radius:50%;background:var(--accent-soft);fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal-card form{display:grid;gap:8px}
.modal-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.modal-card input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.modal-card .acct-primary{padding:12px;border-radius:10px;font-size:14px}
.acct-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:500;color:var(--fg)}
.acct-google:hover{background:var(--bg)}
.acct-google:disabled{opacity:.6;cursor:wait}
.g-logo{width:18px;height:18px}
.modal-card .acct-msg{margin:10px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.modal-note{margin:0 0 2px;font-size:12px;color:var(--muted);text-align:center}
.modal-x{position:absolute;top:12px;right:12px;width:30px;height:30px;font-size:20px;line-height:1;color:var(--muted);border-radius:50%}
.modal-sm{width:min(340px,100%);padding:26px 24px 20px}
.modal-sm h2{font-size:22px}
.modal-sm .modal-lead{margin-bottom:16px}
.check{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;cursor:pointer;margin-bottom:18px}
.check input{width:16px;height:16px;accent-color:var(--bad)}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions button{padding:10px;font-size:14px;border-radius:10px}
.btn-danger{background:var(--bad);color:var(--surface);font-weight:700}
.modal-x:hover{background:var(--bg);color:var(--fg)}
.acct-primary{padding:9px 14px;border-radius:8px;background:var(--accent);color:var(--surface);font-weight:700}
.acct-google{padding:9px;border-radius:8px;border:1px solid var(--line)}
.acct-msg:empty{display:none}
.memo-tools{display:inline-flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.memo-tools label{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px);z-index:20}
/* 문항 이미지 왼쪽 위 번호 자리에 겹친 투명 채점 버튼 + 색연필 채점 표시 */
.qimg{position:relative;overflow:visible}
.qimg img{border-radius:6px}
.qgrade-box{position:absolute;left:0;top:0;width:11%;aspect-ratio:1}
.qgrade{position:absolute;inset:0;cursor:pointer;border-radius:50%}
.qgrade-num{position:relative;font:inherit;color:inherit;padding:0 2px}
.qgrade:focus-visible,.qgrade-num:focus-visible{outline:2px dashed var(--pencil);outline-offset:2px}
.qnum{position:relative}
/* 표시는 버튼 바깥 형제 요소로 둔다(버튼은 내용을 잘라내므로) */
.mark{position:absolute;left:-14%;top:-20%;width:140%;height:140%;pointer-events:none;overflow:visible}
.qnum .mark{left:-35%;top:-40%;width:170%;height:auto}
.mark path{fill:none;stroke:var(--pencil);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:1;stroke-dashoffset:0}
.mark .p2{stroke-width:2.5}
/* 마우스를 올리면 연하게 미리 보이는 동그라미 */
.q:not(.done) .qgrade:hover + .mark .ring,.q:not(.done) .qgrade-num:hover + .mark .ring{opacity:.3;transition:opacity .15s}
.q.done .qgrade,.q.done .qgrade-num{cursor:default}
/* 채점 후: 맞으면 동그라미, 틀리면 빗금을 그려 넣는다 */
